<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Hunt for the Tickets - Settings</title>
    <link rel="stylesheet" href="popup.css" />
    <style>body { width: 420px; }</style>
  </head>
  <body>
    <div id="app">
      <h1>⚔ Extension Settings</h1>
      <label class="settings-label" for="apiUrl">Backend API URL</label>
      <input id="apiUrl" placeholder="http://localhost:4000" />
      <label class="settings-label" for="webUrl">Full Game Web URL</label>
      <input id="webUrl" placeholder="http://localhost:5173" />

      <label class="settings-label" for="excludedRequesters">
        Excluded Zendesk requesters (one per line - name or email; their tickets never earn
        XP, e.g. automated monitoring/alert accounts)
      </label>
      <textarea id="excludedRequesters" rows="4" placeholder="Emergency Sacoa&#10;NAKIVO Backup &amp; Replication"></textarea>

      <button id="save">Save</button>
      <p id="status"></p>
    </div>
    <script src="options.js" type="module"></script>
  </body>
</html>
